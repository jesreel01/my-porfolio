name: PR conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            docs
            content
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter.

  branch:
    name: Conventional branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|style|test|build|ci|content)/[a-z0-9]+([.-][a-z0-9]+)*$'
          if [[ "$BRANCH" =~ ^dependabot/ ]] || [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch '$BRANCH' looks good."
          else
            echo "::error::Branch '$BRANCH' doesn't follow <type>/<short-description>. See CONTRIBUTING.md."
            exit 1
          fi
